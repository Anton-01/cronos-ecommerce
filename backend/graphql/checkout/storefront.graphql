type CartLine {
  productId: ID!
  sku: String
  name: String!
  byRoll: Boolean!
  "Metres or pieces; whole rolls when byRoll is true."
  quantity: String!
  unitPrice: String!
  lineTotal: String!
  discount: String!
  tax: String!
  "What the line costs after discounts (tax included in markets that show tax-inclusive prices)."
  total: String!
}

type CartTotals {
  currency: String!
  taxIncluded: Boolean!
  subtotal: String!
  itemsDiscount: String!
  shipping: String!
  shippingDiscount: String!
  tax: String!
  total: String!
  applied: [AppliedDiscount!]!
}

type Cart {
  id: ID!
  market: String!
  region: String
  couponCode: String
  "Why the coupon is not applied, when it is not."
  couponError: String
  lines: [CartLine!]!
  "Null while the cart is empty or a product can no longer be priced."
  totals: CartTotals
  "Products that went away since they were added (unavailable, unpriced)."
  warning: String
}

type CartSession {
  cart: Cart!
  "The guest token. Returned only when a new guest cart was created: keep it and send it with every cart call."
  token: String
}

input AddressInput {
  recipientName: String! @rules(apply: ["max:120"])
  phone: String @rules(apply: ["max:32"])
  street: String! @rules(apply: ["max:200"])
  exteriorNo: String @rules(apply: ["max:20"])
  interiorNo: String @rules(apply: ["max:20"])
  neighborhood: String @rules(apply: ["max:120"])
  city: String! @rules(apply: ["max:120"])
  state: String! @rules(apply: ["max:120"])
  countryCode: String! @rules(apply: ["size:2"])
  zip: String! @rules(apply: ["max:12"])
  references: String @rules(apply: ["max:300"])
}

input StartCheckoutInput {
  cartId: ID!
  "Guest cart token; not needed for a signed-in shopper."
  token: String
  email: String! @rules(apply: ["email:rfc", "max:255"])
  shippingAddress: AddressInput!
  "Defaults to the shipping address."
  billingAddress: AddressInput
  "Generated by the storefront once per attempt; sending the same key again returns the same checkout."
  idempotencyKey: String! @rules(apply: ["min:8", "max:100"])
}

type Checkout {
  id: ID!
  status: String!
  email: String!
  marketCode: String!
  currency: String!
  taxIncluded: Boolean!
  lines: [CartLine!]!
  totals: CartTotals!
  couponCode: String
  expiresAt: DateTime!
  paidAt: DateTime
  paymentId: ID
}

type PaymentOption {
  provider: String!
  name: String!
  "SANDBOX means no real money moves: show a test banner."
  mode: PaymentMode!
}

type PaymentStart {
  paymentId: ID!
  provider: String!
  mode: PaymentMode!
  status: String!
  "What the storefront must do next: redirect to a URL, or confirm with a client secret."
  clientAction: JSON
  "Public keys the provider's browser SDK needs."
  publicConfig: JSON
}

extend type Query {
  cart(id: ID!, token: String): Cart!
    @throttle(maxAttempts: 120, decayMinutes: 1, prefix: "cart")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CartResolver@cart")
  checkout(id: ID!, token: String): Checkout!
    @throttle(maxAttempts: 120, decayMinutes: 1, prefix: "checkout")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CheckoutResolver@checkout")
  checkoutPaymentOptions(id: ID!, token: String): [PaymentOption!]!
    @throttle(maxAttempts: 60, decayMinutes: 1, prefix: "checkout-options")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CheckoutResolver@options")
}

extend type Mutation {
  "Finds the shopper's cart (account cart, or the guest cart behind the token) or creates one. A guest token is merged into the account on login."
  openCart(market: String!, token: String): CartSession!
    @throttle(maxAttempts: 60, decayMinutes: 1, prefix: "cart-open")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CartResolver@open")
  "Sets the quantity of a line (adds it when new; zero removes it). Pieces/metres by default, whole rolls with byRoll."
  setCartItem(cartId: ID!, token: String, productId: ID!, quantity: String!, byRoll: Boolean = false): Cart!
    @throttle(maxAttempts: 120, decayMinutes: 1, prefix: "cart-write")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CartResolver@setItem")
  removeCartItem(cartId: ID!, token: String, productId: ID!): Cart!
    @throttle(maxAttempts: 120, decayMinutes: 1, prefix: "cart-write")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CartResolver@removeItem")
  "Applies a coupon code (or removes it with null). An invalid code is reported in cart.couponError, not as a failure."
  applyCartCoupon(cartId: ID!, token: String, code: String): Cart!
    @throttle(maxAttempts: 30, decayMinutes: 1, prefix: "cart-coupon")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CartResolver@coupon")
  setCartMarket(cartId: ID!, token: String, market: String!, region: String): Cart!
    @throttle(maxAttempts: 30, decayMinutes: 1, prefix: "cart-write")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CartResolver@market")
  "Freezes prices, taxes, shipping and addresses, and holds the stock for a few minutes. Failure codes: INSUFFICIENT_STOCK, FRAUD_BLOCKED, SHIPPING_COUNTRY_MISMATCH, INVALID_ADDRESS, COUPON_*."
  startCheckout(input: StartCheckoutInput!): Checkout!
    @throttle(maxAttempts: 10, decayMinutes: 1, prefix: "checkout-start")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CheckoutResolver@start")
  "Starts (or resumes) the payment with one provider. Calling again with the same provider returns the same payment."
  payCheckout(id: ID!, token: String, provider: String!, returnUrl: String!, cancelUrl: String!): PaymentStart!
    @throttle(maxAttempts: 10, decayMinutes: 1, prefix: "checkout-pay")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CheckoutResolver@pay")
  "The shopper came back from the provider: completes and re-reads the payment (PayPal capture). Safe to call repeatedly."
  confirmCheckoutPayment(id: ID!, token: String): Checkout!
    @throttle(maxAttempts: 30, decayMinutes: 1, prefix: "checkout-confirm")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CheckoutResolver@confirm")
  cancelCheckout(id: ID!, token: String): Checkout!
    @throttle(maxAttempts: 10, decayMinutes: 1, prefix: "checkout-cancel")
    @field(resolver: "Cronos\\Checkout\\Interfaces\\GraphQL\\CheckoutResolver@cancel")
}
