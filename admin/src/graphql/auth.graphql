mutation AdminLogin($input: AdminLoginInput!) {
  adminLogin(input: $input) {
    token
    expiresAt
    user {
      id
    }
  }
}

mutation AdminLogout {
  logout
}

query AdminMe {
  adminMe {
    id
    email
    roles
    permissions
    avatarUrl
    profile {
      firstName
      lastName
    }
  }
}

mutation UpdateMyAvatar($file: Upload!) {
  updateMyAvatar(file: $file) {
    id
    avatarUrl
  }
}
